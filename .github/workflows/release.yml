# Release of Shap3D.ai – runs by itself on every push to main and releases the version in package.json
# when there is no release (tag v<version>) for it yet. So a release is: raise the version, add its section
# to CHANGELOG.md, push. No tag by hand – publishing the release creates the tag on the pushed commit.
# Pushes without a new version end after the first job. "Run workflow" (workflow_dispatch) starts it by hand,
# e.g. to finish a release whose run failed.
#
#   version   reads package.json and decides: release (no tag v<version> yet) or nothing to do
#   prepare   CHANGELOG.md section, lint, format check, web build, draft release
#   desktop   Tauri installers for Windows (MSI, NSIS), macOS (.dmg, universal) and Linux (.deb, .rpm, AppImage)
#   docker    images on GHCR: dev target (with remote API) and static target (nginx)
#   publish   turns the draft into the real release once everything above has worked
#
# Actions are pinned to commit SHAs; the comment behind each one names the release.

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# one release run at a time; a newer push to main replaces a run that is still building the same version
concurrency:
  group: release
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  version:
    name: New version?
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version from package.json, released already?
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # 0.9.0-rc.1 and the like become a pre-release
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is released already – raise the version in package.json for a new release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing $tag."
          fi

  prepare:
    name: Check, web build and draft release
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # everything between "## [<version>]" and the next "## " heading (or the link list at the end),
          # without leading blank lines – $(…) drops the trailing ones
          notes="$(awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d')"
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no section \"## [$VERSION]\"."
            exit 1
          fi
          printf '%s\n' "$notes" > release-notes.md
          cat release-notes.md

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

      - name: Pack web build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: cd dist && zip -qr "../shap3d-ai_${VERSION}_web.zip" .

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # a draft has no tag yet – it points at this commit, and publishing creates the tag there.
          # A later run for the same version (re-run, or a newer push before it was published) reuses the draft
          # and moves it to its own commit with the current release notes.
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n 1)"
          if [ -z "$release_id" ]; then
            release_id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Shap3D.ai $VERSION" \
              -F body=@release-notes.md \
              -F draft=true \
              -F prerelease="$PRERELEASE" \
              --jq .id)"
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -f target_commitish="$GITHUB_SHA" \
              -F body=@release-notes.md \
              --silent
          fi
          echo "id=$release_id" >> "$GITHUB_OUTPUT"
          gh release upload "$TAG" "shap3d-ai_${VERSION}_web.zip" --clobber

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: [version, prepare]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            args: ''
            rust_targets: ''
          - name: macOS
            runner: macos-latest
            # one .dmg for Apple silicon and Intel
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
          - name: Linux
            # oldest supported Ubuntu: the .deb and the AppImage then also run on older glibc versions
            runner: ubuntu-22.04
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Rust toolchain
        shell: bash
        env:
          RUST_TARGETS: ${{ matrix.rust_targets }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          for target in $RUST_TARGETS; do rustup target add "$target"; done

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - run: npm ci --no-audit --no-fund

      # same as `npm run desktop:build` (tauri build – it runs `npm run build` itself), uploads into the draft
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.prepare.outputs.release_id }}

  docker:
    name: Docker images (GHCR)
    needs: [version, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ghcr.io/<owner>/shap3d.ai:0.9.0, :0.9, :latest – dev server with remote API
          - target: dev
            suffix: ''
            latest: ${{ needs.version.outputs.prerelease == 'false' }}
            extra_tag: ''
          # ghcr.io/<owner>/shap3d.ai:0.9.0-static, :0.9-static, :static – production build with nginx
          - target: static
            suffix: -static
            latest: 'false'
            extra_tag: type=raw,value=static,enable=${{ needs.version.outputs.prerelease == 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=${{ matrix.latest }}
            suffix=${{ matrix.suffix }},onlatest=true
          # the version comes from package.json – the run belongs to a push to main, not to a tag
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }},enable=${{ needs.version.outputs.prerelease == 'false' }}
            ${{ matrix.extra_tag }}
          labels: |
            org.opencontainers.image.title=Shap3D.ai${{ matrix.suffix }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  publish:
    name: Publish release
    needs: [version, prepare, desktop, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # publishing creates the tag v<version> on the commit the draft points at
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest="$([ "$PRERELEASE" = true ] && echo false || echo true)" \
            --silent
