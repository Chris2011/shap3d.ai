<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shap3D.ai</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0b0f14" />
    <style>
      /* splash screen – plain HTML/CSS so it shows before any JavaScript has loaded */
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
        background-color: #0b0f14;
        background-image: linear-gradient(rgba(230, 235, 241, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(230, 235, 241, .035) 1px, transparent 1px);
        background-size: 32px 32px; background-position: center;
        font-family: 'Segoe UI', 'Inter', system-ui, sans-serif; transition: opacity .45s ease, visibility .45s; }
      #splash.done { opacity: 0; visibility: hidden; }
      #splash svg { width: 120px; height: 120px; overflow: visible; }
      #splash .edge { fill: none; stroke: #e6ebf1; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: s3d-draw .7s cubic-bezier(.6, 0, .2, 1) forwards; }
      #splash .outer { stroke-width: 2.2; }
      #splash .inner { stroke-width: 1.4; opacity: .55; animation-delay: .55s; }
      #splash .ring { fill: none; stroke: #5fd4e6; stroke-width: 1.2; opacity: 0; transform-origin: 32px 32px; animation: s3d-ring 1.6s ease-out 1.05s infinite; }
      #splash .node { fill: #5fd4e6; transform-origin: 32px 32px; transform: scale(0); animation: s3d-pop .45s cubic-bezier(.3, 1.6, .5, 1) .95s forwards; filter: drop-shadow(0 0 6px rgba(95, 212, 230, .7)); }
      #splash .word { font-size: 34px; font-weight: 600; letter-spacing: 1px; color: #e6ebf1; display: flex; }
      #splash .word span, #splash .word b { opacity: 0; transform: translateY(6px); }
      #splash .word span { animation: s3d-in .35s ease-out forwards; }
      #splash .word b { font-weight: 700; color: #e6ebf1; animation: s3d-in .35s ease-out forwards, s3d-lit .5s ease-out forwards; }
      #splash .tag { font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; color: #7d8794; opacity: 0; animation: s3d-in .5s ease-out 1.5s forwards; }
      #splash .bar { width: 160px; height: 2px; background: rgba(230, 235, 241, .08); overflow: hidden; border-radius: 1px; }
      #splash .bar::after { content: ''; display: block; width: 40%; height: 100%; background: #5fd4e6; animation: s3d-load 1.1s ease-in-out infinite; }
      @keyframes s3d-draw { to { stroke-dashoffset: 0; } }
      @keyframes s3d-pop { to { transform: scale(1); } }
      @keyframes s3d-ring { 0% { opacity: .6; transform: scale(.6); } 100% { opacity: 0; transform: scale(2.2); } }
      @keyframes s3d-in { to { opacity: 1; transform: none; } }
      @keyframes s3d-lit { to { color: #5fd4e6; text-shadow: 0 0 14px rgba(95, 212, 230, .45); } }
      @keyframes s3d-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::after { animation-duration: 1ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-label="Shap3D.ai wird geladen" role="status">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path class="edge outer" pathLength="1" d="M32 12 L49 22 V42 L32 52 L15 42 V22 Z" />
        <path class="edge inner" pathLength="1" d="M15 22 L32 32 L49 22 M32 32 V52" />
        <circle class="ring" cx="32" cy="32" r="6.5" />
        <circle class="node" cx="32" cy="32" r="3.4" />
      </svg>
      <div class="word">
        <span style="animation-delay: 1.00s">S</span><span style="animation-delay: 1.05s">h</span><span style="animation-delay: 1.10s">a</span><span style="animation-delay: 1.15s">p</span>
        <b style="animation-delay: 1.20s, 1.55s">3</b><b style="animation-delay: 1.25s, 1.60s">D</b>
        <span style="animation-delay: 1.30s">.</span>
        <b style="animation-delay: 1.35s, 1.65s">a</b><b style="animation-delay: 1.40s, 1.70s">i</b>
      </div>
      <div class="tag">Easy 3D-Modellieren mit KI</div>
      <div class="bar"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
